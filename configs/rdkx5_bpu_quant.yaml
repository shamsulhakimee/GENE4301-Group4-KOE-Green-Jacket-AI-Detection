# Horizon OpenExplorer BPU Quantization Configuration
# Target Hardware: RDK X5 (Horizon Bayes Architecture, 10 TOPS BPU)
# Tool: hb_mapper makertbin
# Reference: https://github.com/D-Robotics/rdk_model_zoo

model_parameters:
  onnx_model: "best.onnx"
  output_model_file_prefix: "koe_green_jacket_yolov8n"
  march: "bayes-e"

input_parameters:
  input_name_list:
    - "images"
  input_type_train: "rgb"
  input_layout_train: "NCHW"
  input_type_rt: "nv12"         # Hardware video engine standard on RDK X5
  input_layout_rt: "NCHW"
  norm_type: "data_scale"
  scale_value_list:
    - 0.003921568627451         # 1.0 / 255.0

calibration_parameters:
  cal_data_dir: "./calibration_dataset"
  cal_data_type: "float32"
  calibration_type: "max"       # Or "kl" / "default"
  max_percentile: 0.9999

compiler_parameters:
  compile_mode: "latency"       # Optimize for minimum inference latency
  optimize_level: "O3"
  debug: false
