# Ultralytics YOLOv8n Training Configuration
# Target: KOE Green Jacket PPE Detection

# Dataset
data: "data.yaml"  # Path to Roboflow exported data.yaml

# Model Architecture
model: "yolov8n.pt" # Pretrained COCO weights baseline
task: "detect"
mode: "train"

# Hyperparameters
epochs: 200
imgsz: 640
batch: 32
workers: 8
device: 0           # GPU ID on Google Colab

# Optimizer
optimizer: "AdamW"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Early Stopping & Checkpointing
patience: 40
save: true
save_period: 25

# Data Augmentation (Tuned for workshop lighting & distance variation)
mosaic: 1.0
mixup: 0.1
hsv_h: 0.015        # Hue shift fraction (distinguishes olive/dark green from bright green)
hsv_s: 0.7          # Saturation shift fraction
hsv_v: 0.4          # Brightness / value shift fraction
degrees: 10.0       # Rotation degrees (+/- 10)
translate: 0.1      # Translation fraction
scale: 0.5          # Scale jitter
fliplr: 0.5         # Horizontal flip probability
flipud: 0.0         # No vertical flip (jackets are upright)
